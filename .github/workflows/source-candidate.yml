name: Source candidate CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  source-candidate:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Source candidate gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: package
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: package
          persist-credentials: false
      - name: Check out canonical-json candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/canonical-json
          ref: e7006a2580a49a1c8ab507b0d7b9c3403b4f9f58
          path: dependencies/canonical-json
          persist-credentials: false
      - name: Check out automation candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/automation
          ref: 5bb46bc6c87abd33812ab5a935a198cb36a86cda
          path: dependencies/automation
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, tokenizer, dom, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Install explicit candidate dependency graph
        run: php tools/install-source-candidate.php
      - name: Verify original Composer metadata
        run: composer validate --strict
      - name: Run package source checks and behavior tests
        run: composer check
      - name: Verify authoritative archive consumer
        run: composer clean-consumer
      - name: Record candidate scope
        run: |
          cat ../candidate-dependency-evidence.json
          echo 'Source verification only; immutable release and adoption gates remain separate.'
